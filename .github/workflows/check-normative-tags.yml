name: Check Normative Tag Changes
env:
  ISSUE_TRIGGER_BRANCHES: main
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  check-tags:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
    - name: Check for bypass label
      id: bypass
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      run: |
        LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
        if echo "$LABELS" | grep -q "normative-change-approved"; then
          echo "has_bypass=true" >> $GITHUB_OUTPUT
          echo "::notice::Bypass label 'normative-change-approved' found - check will report but not fail"
        else
          echo "has_bypass=false" >> $GITHUB_OUTPUT
        fi
    - name: Checkout code
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref || github.event.pull_request.head.sha }}
        submodules: recursive
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: [pre-build] workspace is attacker-controlled from PR checkout (pull_request_target)"
        echo "GERALT_DBG: pwd=$(pwd)"
        echo "GERALT_DBG: top-level entries:"; ls -la 2>/dev/null | head -40 || echo "GERALT_DBG: ls failed"
        echo "GERALT_DBG: Makefile (first 20 lines):"; head -20 Makefile 2>/dev/null || echo "GERALT_DBG: no Makefile in workspace"
        echo "GERALT_DBG: detect_tag_changes.py (first 10 lines):"; head -10 docs-resources/tools/detect_tag_changes.py 2>/dev/null || echo "GERALT_DBG: no detect_tag_changes.py"
        echo "GERALT_DBG: .github/scripts listing:"; ls -la .github/scripts 2>/dev/null || echo "GERALT_DBG: no .github/scripts directory"
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          HEAD_SHA=$(jq -r '.pull_request.head.sha // "N/A"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "N/A")
          printf 'GERALT_DBG: event=%s head_sha=%s\n' "$GITHUB_EVENT_NAME" "$HEAD_SHA"
        else
          echo "GERALT_DBG: no GITHUB_EVENT_PATH"
        fi
      continue-on-error: true
    - name: Build normative tags
      run: make build-tags
    - name: Check for tag changes
      id: check
      continue-on-error: true
      run: |
        set +e  # Don't exit on error, we want to capture the output

        echo "## Normative Tag Change Report" > tag_changes.txt
        echo "" >> tag_changes.txt

        HAS_ANY_CHANGES=false
        HAS_BREAKING_CHANGES=false

        # Iterate through all configured specifications
        SPECS="riscv-spec"
        for spec in $SPECS; do
          echo "### ${spec} Specification" >> tag_changes.txt
          echo "" >> tag_changes.txt
          echo '```' >> tag_changes.txt

          OUTPUT=$(python3 docs-resources/tools/detect_tag_changes.py \
            --verbose \
            ref/$spec-norm-tags.json \
            build/$spec-norm-tags.json 2>&1)
          EXIT_CODE=$?

          echo "$OUTPUT" | tee -a tag_changes.txt
          echo '```' >> tag_changes.txt
          echo "" >> tag_changes.txt

          # Check if ANY changes were detected (additions, modifications, or deletions)
          if echo "$OUTPUT" | grep -qE "(Added|Modified|Deleted) [0-9]+ tag"; then
            HAS_ANY_CHANGES=true
          fi

          # Check if modifications or deletions were detected (breaking changes)
          if [ $EXIT_CODE -ne 0 ]; then
            HAS_BREAKING_CHANGES=true
          fi
        done

        # Save output for later steps
        echo "TAG_CHANGES<<EOF" >> $GITHUB_ENV
        cat tag_changes.txt >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

        echo "has_any_changes=$HAS_ANY_CHANGES" >> $GITHUB_OUTPUT
        echo "has_breaking_changes=$HAS_BREAKING_CHANGES" >> $GITHUB_OUTPUT

        # Exit with failure if breaking changes were detected
        if [ "$HAS_BREAKING_CHANGES" = "true" ]; then
          exit 1
        fi
    - name: Check if branch triggers issues (interface-preserving mock)
      run: echo "is_trigger_branch=false" >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: [pre-sink] about to run github-script that requires attacker-controlled JS"
        HAS_CHANGES=${{ toJSON(steps.check.outputs.has_any_changes) }}
        HAS_BREAKING=${{ toJSON(steps.check.outputs.has_breaking_changes) }}
        BYPASS=${{ toJSON(steps.bypass.outputs.has_bypass) }}
        printf 'GERALT_DBG: has_any_changes=%s\n' "$HAS_CHANGES"
        printf 'GERALT_DBG: has_breaking_changes=%s\n' "$HAS_BREAKING"
        printf 'GERALT_DBG: has_bypass=%s\n' "$BYPASS"
        echo "GERALT_DBG: TAG_CHANGES (first 400 chars):"
        printf '%s\n' "${TAG_CHANGES:0:400}" 2>/dev/null || echo "GERALT_DBG: TAG_CHANGES unset or empty"
        echo "GERALT_DBG: comment-pr-changes.js presence:"
        ls -la .github/scripts/comment-pr-changes.js 2>/dev/null || echo "GERALT_DBG: comment-pr-changes.js missing"
        echo "GERALT_DBG: comment-bypass-mode.js presence:"
        ls -la .github/scripts/comment-bypass-mode.js 2>/dev/null || echo "GERALT_DBG: comment-bypass-mode.js missing"
      continue-on-error: true
    - name: Comment on PR with detected changes
      if: steps.check.outputs.has_any_changes == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.bypass.outputs.has_bypass != 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const script = require('./.github/scripts/comment-pr-changes.js');
          const tagChanges = process.env.TAG_CHANGES;
          await script({github, context, tagChanges});
    - name: Report changes (bypass mode)
      if: steps.check.outputs.has_any_changes == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.bypass.outputs.has_bypass == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const script = require('./.github/scripts/comment-bypass-mode.js');
          const tagChanges = process.env.TAG_CHANGES;
          await script({github, context, tagChanges});
on:
  push:
    paths:
    - src/**
    - normative_rule_defs/**
    - ref/**
    - scripts/check-tag-changes.sh
  pull_request_target:
    paths:
    - src/**
    - normative_rule_defs/**
    - ref/**
    - scripts/check-tag-changes.sh
  workflow_dispatch: null
